- learn_more: 'İlgili arayüz kılavuzunu aç'
- pin_desc_gpio: 'Bu pini düz bir dijital giriş veya çıkış olarak kullanabilirsiniz. libgpiod araçlarıyla kontrol edin ve pini numarasıyla değil GPIO sayfasında listelenen sistem adıyla arayın; numaralar yazılım sürümleri arasında değişebilir.'
- pin_warning_gpio: 'Bu pin doğrudan işlemciye bağlıdır, arada koruma sağlayan hiçbir şey yoktur; bu yüzden buraya uygulanan 5 V kartı bozabilir. Pin güç değil sinyal pinidir: LED, buzzer, röle veya motor çalıştırmak için bir sürücü, transistör ya da röle modülü kullanın.'
- pin_desc_i2c: 'Bu, kendi cihazlarınız için ayrılmış iki I2C pininden biridir: pin 3 veri, pin 5 saat hattıdır. Pull-up dirençleri kartta hazır bulunur. Veri yolunu bulmak için ls /dev/i2c-* komutunu çalıştırın; numarası yazılım imajları arasında değişir.'
- pin_warning_i2c: 'Yalnızca 3,3 V cihaz kullanın ve hattaki her cihaza farklı bir adres verin, aksi halde birbirleriyle çakışırlar. Kartta halihazırda pull-up dirençleri vardır; yenisini eklemeden önce bunu göz önünde bulundurun.'
- pin_desc_hat_i2c: 'Bu, ikinci bir I2C veri yolunun iki pininden biridir. Hat ilki gibi çalışır ama paylaşımlıdır: kartın gücünü yöneten çip, gerçek zaman saati ve küçük bir bellek çipi bu hatta zaten bağlıdır. Raspberry Pi''de bir HAT kimlik çipini de burada tutar.'
- pin_warning_hat_i2c: 'Buraya bir cihaz ekleyebilirsiniz; ancak i2cdetect ile hangi adreslerin dolu olduğunu kontrol edip çakışmayan bir adres seçin ve mevcut cihazlara dokunmayın. 3 ve 5 numaralı pinlerden daha dikkatli olun: güç yönetim çipi bu hatta olduğu için bir kısa devre ya da kilitlenen bir hat kartın tamamını durdurur. Günlük eklentiler için 3 ve 5 numaralı pinler daha kolay seçimdir.'
- pin_desc_spi: 'Bu, beş SPI pininden biridir: 19 veri gönderir, 21 veri alır, 23 saat hattıdır, 24 ve 26 ise chip-select hatlarıdır. İlgili overlay etkinleştirildiğinde bunlar Linux''ta /dev/spidev0.0 ve /dev/spidev0.2 olarak görünür.'
- pin_warning_spi: 'Kartın kendi basınç ve hareket sensörleri veri ve saat pinlerini sizinle paylaşır. Kendi chip-select hatları olduğu için cihazınız onlarla karışmaz; ancak cihazınız chip-select''i etkin değilken veri giriş pinini sürmeyi bırakmalıdır, yoksa sensör okumaları yanlış çıkar. 3,3 V sinyal kullanın.'
- pin_desc_uart: 'Bu, seri port pinlerinden biridir: pin 8 gönderir, pin 10 alır, 11 ve 36 ise ihtiyaç duyan cihazlar için akış kontrolü ekler. Linux''ta bu port /dev/ttyS3 olarak görünür. Karttaki üç pinli konnektör, açılış konsolu için ayrı bir seri porttur.'
- pin_warning_uart: 'Yalnızca 3,3 V seri bağlantı kullanın; bunu asla bir RS-232 portuna veya 5 V''luk bir dönüştürücüye bağlamayın, ikisi de kartı bozar. Bazı overlay''ler bu pinlere başka işlevler taşır; bir pin beklendiği gibi davranmıyorsa /boot/uEnv.txt dosyasını kontrol edin.'
- pin_desc_pcm: 'Bu, dört dijital ses pininden biridir ve bunlar Raspberry Pi''nin I2S için kullandığı konumlarla aynıdır. Pi''den farklı olarak her iki veri pini yazılımda giriş ya da çıkış olarak ayarlanabilir; hangisinin ne olduğunu ses yapılandırması belirler.'
- pin_warning_pcm: 'Bir Raspberry Pi ses HAT''i yerine takılır, ancak yalnızca T3 Gemstone yazılımında o HAT''in ses çipi için bir sürücü varsa ve sinyaller doğru yönde ayarlanmışsa çalışır. Ses için böyle bir kart almadan önce dokümantasyonu kontrol edin.'
- pin_desc_3v3: 'Bu pin 3,3 V verir; bu, sinyal pinlerinin de çalıştığı gerilimdir ve sensörler ile az güç çeken diğer eklentiler için doğru beslemedir. Kart bu beslemeyi M.2 yuvası ile kamera, ekran ve USB konnektörleriyle paylaşır.'
- pin_warning_3v3: 'Motor, ısıtıcı, LED şeridi ve servolara kendi beslemesini verin. 1 veya 17 numaralı pinlere kendi 3,3 V''unuzu uygulamayın: bunlar çıkıştır ve bu, kartın regülatörüne karşı çalışır.'
- pin_desc_5v: 'Bu pin, 3,3 V''tan fazlasına ihtiyaç duyan eklentiler için 5 V verir. Gerilim, güç kaynağınızdan doğrudan değil, karttaki bir regülatörden gelir. Sinyal pinleri hala yalnızca 3,3 V''tur.'
- pin_warning_5v: '2 veya 4 numaralı pinlerden karta güç vermeyin; bunlar çıkıştır ve buraya 5 V uygulamak kartın regülatörüne karşı çalışıp güç girişindeki korumayı atlar. Motor, ısıtıcı ve büyük LED veya servo yükleri kendi beslemesine ihtiyaç duyar; gerektiğinde toprağı kartla ortaklayın.'
- pin_desc_ground: 'Bu pin kartın toprak düzlemine bağlıdır ve güç ile lojik sinyaller için 0 V referansı sağlar. Kablolamayı kısa ve anlaşılır tutmak için sinyal grubuna en yakın toprak pinini tercih edin.'
