- pin_desc_gpio: 'You can use this pin as a plain digital input or output. Control it with the libgpiod tools, and look the pin up by its system name, listed on the GPIO page, rather than by number - the numbers can change between software versions.'
- pin_warning_gpio: 'This pin connects straight to the processor, with nothing in between to protect it, so 5 V here can destroy the board. It is a signal pin, not a power pin: use a driver, transistor or relay module to run an LED, buzzer, relay or motor.'
- pin_desc_i2c: 'This is one of the two I2C pins for your own devices: pin 3 is data and pin 5 is the clock. The pull-up resistors are already on the board. Run ls /dev/i2c-* to find the bus, as its number changes between software images.'
- pin_warning_i2c: 'Use 3.3 V devices only, and give every device on the bus a different address or they will fight each other. The board already has its own pull-up resistors, so bear that in mind before adding more.'
- pin_desc_hat_i2c: 'This is one of the two pins of a second I2C bus, which works like the first one but is shared: the chip that manages the board''s power, the real-time clock and a small memory chip are already on it. On a Raspberry Pi this is also where a HAT keeps its identification chip.'
- pin_warning_hat_i2c: 'You can add a device here, but check with i2cdetect which addresses are already taken and pick one that does not clash, and leave the existing devices alone. Take more care than on pins 3 and 5: the power-management chip is on this bus, so a short or a jammed bus stops the whole board. For everyday add-ons, pins 3 and 5 are the easier choice.'
- pin_desc_spi: 'This is one of the five SPI pins: 19 sends data, 21 receives it, 23 is the clock, and 24 and 26 are the chip selects. In Linux they show up as /dev/spidev0.0 and /dev/spidev0.2 once the matching overlay is enabled.'
- pin_warning_spi: 'The board''s own pressure and motion sensors share the data and clock pins with you. They have their own chip selects, so your device will not be confused with them, but it must stop driving the data-in pin whenever its chip select is inactive or the sensor readings will be wrong. Use 3.3 V signals.'
- pin_desc_uart: 'This is one of the serial port pins: pin 8 sends, pin 10 receives, and pins 11 and 36 add flow control for devices that need it. In Linux the port is /dev/ttyS3. The three-pin connector on the board is a separate serial port for the boot console.'
- pin_warning_uart: 'Use 3.3 V serial only - never wire this to an RS-232 port or a 5 V adapter, as both will damage the board. Some overlays move other functions onto these pins, so check /boot/uEnv.txt if a pin does not behave as expected.'
- pin_desc_pcm: 'This is one of the four digital audio pins, in the same positions a Raspberry Pi uses for I2S. Unlike a Pi, either data pin can be set up as an input or an output in software, so which is which depends on the audio configuration.'
- pin_warning_pcm: 'A Raspberry Pi audio HAT will plug in, but it only works if T3 Gemstone''s software has a driver for that HAT''s audio chip and the signals are set up the right way round. Check the documentation before buying one for audio.'
- pin_desc_3v3: 'This pin supplies 3.3 V, the same voltage the signal pins work at, which makes it the right supply for sensors and other low-power add-ons. The board shares this supply with the M.2 slot and the camera, display and USB connectors.'
- pin_warning_3v3: 'Give motors, heaters, LED strips and servos their own supply. Do not feed your own 3.3 V into pins 1 or 17: they are an output, and doing so pushes against the board''s regulator.'
- pin_desc_5v: 'This pin supplies 5 V for add-ons that need more than 3.3 V. It comes from a regulator on the board rather than straight from your power supply. The signal pins are still 3.3 V only.'
- pin_warning_5v: 'Do not feed power into pins 2 or 4 - they are an output, and pushing 5 V in fights the board''s regulator and skips the protection on its power input. Motors, heaters and large LED or servo loads need their own supply, sharing a ground with the board where required.'
- pin_desc_ground: 'This pin is connected to the board ground plane and provides the 0 V reference for power and logic signals. Prefer the ground pin nearest the signal group to keep wiring short and clear.'
